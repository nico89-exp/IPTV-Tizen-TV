name: Build IPTV Manager WGT

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: npm install

      - name: Download HLS.js
        run: npm run install-hls

      - name: Create WGT
        run: |
          zip -r IPTVManager.wgt . \
            -x ".git/*" \
            -x ".github/*" \
            -x "node_modules/*" \
            -x "*.md" \
            -x "package*.json" \
            -x "scripts/*"

      - name: Show WGT contents
        run: unzip -l IPTVManager.wgt

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: IPTVManager
          path: IPTVManager.wgt

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: IPTVManager.wgt
